<style>

<script>
const VER='2.4.0',BUILD=18,GM='gemini-2.5-flash',IC={strom:'⚡',gas:'🔥',wasser:'💧',internet:'🌐',pv:'☀️'},TN={strom:'Strom',gas:'Gas',wasser:'Wasser',internet:'Fixkosten',pv:'Einspeisung'},CL={strom:'s',gas:'g',wasser:'w',internet:'i',pv:'p'},RU={strom:'kWh',gas:'m³',wasser:'m³',pv:'kWh'},K='energix.v1',$=id=>document.getElementById(id);
let S={p:[],m:[],h:[],dc:[],z:100},V='home',CM=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
function norm(){if(!Array.isArray(S.o)||!S.o.length)S.o=[{id:'o1',n:'Eigenheim'}];if(!S.ao||(S.ao!='all'&&!S.o.find(o=>o.id==S.ao)))S.ao=S.o[0].id;S.p.forEach(x=>{if(!x.o)x.o=S.o[0].id});S.m.forEach(x=>{if(!x.o)x.o=S.o[0].id})}
const curO=()=>S.ao=='all'?S.o[0].id:S.ao,inO=x=>S.ao=='all'||x.o==S.ao;
function view(fn){const P=S.p,M=S.m,H=S.h;S.p=P.filter(inO);S.m=M.filter(inO);S.h=H.filter(h=>S.p.some(p=>p.id==h.pid));try{return fn()}finally{S.p=P;S.m=M;S.h=H}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Speichern nicht möglich')}};
try{S.gk=localStorage.getItem('energix.gk')||S.gk||''}catch(e){}
norm();
const TABS={home:'home',uebersicht:'home',prof:'prof',profile:'prof',meter:'meter',zaehler:'meter',ablesen:'meter',hist:'hist',historie:'hist',chart:'chart',verlauf:'chart',aus:'aus',auswertung:'aus',set:'set',einstellungen:'set'};
V=TABS[((typeof location!=='undefined'&&location.hash)||'').slice(1).toLowerCase()]||S.st||'home';
const uid=()=>Math.random().toString(36).slice(2,9);
const f=(n,d=2)=>(+n||0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const isoU=ms=>new Date(ms).toISOString().slice(0,10),today=()=>iso(new Date());
function zoom(d){S.z=Math.min(160,Math.max(70,S.z+d));save();document.documentElement.style.fontSize=S.z+'%'}
function go(v){V=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();scrollTo(0,0)}
function curAb(p){const a=S.h.filter(x=>x.t=='ab'&&x.pid==p.id).sort((x,y)=>x.d.localeCompare(y.d)).at(-1);return a?a.v:+p.cur||0}
function rd(m){return [...m.r].sort((a,b)=>a.d.localeCompare(b.d))}
function fac(m){if(m.t!='gas')return 1;const p=S.p.find(p=>p.mid==m.id);return +(p&&p.bw)||10}
function calc(p){if(p.t=='internet'){const g=apAt(p,today()),cost=g*12/(+p.iv||1)-(+p.bo||0);return{kwh:0,src:'',cost,ab:cost/12,diff:null}}

  const m=S.m.find(m=>m.id==p.mid);let kwh=+p.est||0,src='manuell geschätzt';
  if(m){const r=rd(m);if(r.length>1){const days=(new Date(r.at(-1).d)-new Date(r[0].d))/864e5;
    if(days>=30){kwh=periods(m).reduce((a,q)=>a+q.k,0)/days*365;src='hochgerechnet aus Zählerständen'}}}
  if(p.t=='pv'){const A=apAt(p,today()),cost=-(kwh*A/100)+(+p.gp||0)*12-(+p.bo||0);return{kwh,src,cost,ab:cost/12,diff:null}}
  const W=p.t=='wasser',A=apAt(p,today()),cost=((W?kwh*(A+(+p.aw||0))+(+p.nw||0):kwh*A/100)+p.gp*12-(+p.bo||0))*(1+(+p.pf||0)/100);
  return{kwh,src,cost,ab:cost/12,diff:curAb(p)?cost/12-curAb(p):null}}
function periods(m){const r=rd(m),o=[];for(let i=1;i<r.length;i++){const d=(new Date(r[i].d)-new Date(r[i-1].d))/864e5;
  if(d>0){const k=((r[i].ch!==undefined?r[i].ch:r[i].v)-r[i-1].v)*fac(m);o.push({d:r[i].d,s:r[i-1].d,k,pd:k/d})}}return o}
const D={strom:['Strom',35,12,3000],gas:['Gas',10,10,15000],wasser:['Wasser',2.2,5,120],internet:['Fixkosten',0,0,0],pv:['Einspeisung',8,0,3000]};function addP(t){const d=D[t];S.p.push({id:uid(),o:curO(),t,n:d[0],an:'',ap:d[1],gp:d[2],bo:0,bw:10,aw:t=='wasser'?2.5:0,nw:0,est:d[3],cur:0,pf:0,mid:'',ve:'',kf:1,iv:1,za:'',zd:'',ri:0,rl:3,ic:t=='internet'?'💶':''});save();render()}
function addM(t){S.m.push({id:uid(),o:curO(),t,n:'',nr:'',r:[]});save();render()}
function upd(k,id,key,val,num){const o=S[k].find(x=>x.id==id);o[key]=num?parseFloat(String(val).replace(',','.'))||0:val;if(k=='o'&&key=='ort'){o.lat=0;o.lon=0}if(k=='p'&&key=='cur'&&o.cur>0)S.h.push({id:uid(),t:'ab',pid:id,d:today(),v:o.cur,n:'Profil geändert'});save();if(k=='p'&&['vb','ml','vl','kf','ve'].includes(key)){const e=$('kd'+id);if(e)e.innerHTML=kdTxt(o)}if(k=='p'&&key.startsWith('pe_')){const e=$('pe'+id);if(e)e.innerHTML=peTxt(o)}if(key=='mid'||key=='t'||key=='o'||(k=='o'&&key=='n'))render()}
const PH={},SC={};let UN=null,UT=null;
function flushUndo(){if(UN){UN.ids.forEach(i=>{try{dbx('readwrite',st=>st.delete(i)).catch(()=>{})}catch(e){}});UN=null}clearTimeout(UT)}
function snap(label,ids){flushUndo();UN={s:JSON.stringify(S),ids:ids||[]};$('undoT').textContent=label;$('undo').style.display='flex';UT=setTimeout(()=>{flushUndo();$('undo').style.display='none'},8000)}
function undo(){if(!UN)return;clearTimeout(UT);const g=S.gk;S=JSON.parse(UN.s);S.gk=g;UN=null;$('undo').style.display='none';norm();save();render()}
function del(k,id){if(!confirm('Wirklich löschen?'))return;const ids=[];
 if(k=='p')S.dc.filter(d=>d.pid==id).forEach(d=>ids.push(d.id));
 if(k=='m'){const m=S.m.find(x=>x.id==id);if(m)m.r.forEach(x=>x.ph&&ids.push(x.ph))}
 snap(k=='p'?'Profil gelöscht':k=='m'?'Zähler gelöscht':'Gelöscht',ids);
 if(k=='p')S.dc=S.dc.filter(d=>d.pid!=id);S[k]=S[k].filter(x=>x.id!=id);save();render()}
async function shrink(file){try{const bmp=await createImageBitmap(file),sc=Math.min(1,1280/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(res,'image/jpeg',.8))||file}catch(e){return file}}
async function addR(id){const m=S.m.find(x=>x.id==id),d=$('d'+id).value,v=parseFloat($('v'+id).value.replace(',','.'));
  if(!d||isNaN(v))return alert('Datum und Stand eingeben');if(!chk(m,d,v))return;const rec={d,v};
  if(PH[id]){try{const b=await shrink(PH[id]),buf=await b.arrayBuffer(),pid=uid();await dbx('readwrite',st=>st.put({id:pid,buf,type:'image/jpeg'}));rec.ph=pid}catch(e){}delete PH[id]}
  m.r.push(rec);save();render()}
async function openPh(pid){try{const x=await dbx('readonly',st=>st.get(pid));if(!x)return alert('Das Foto liegt nicht auf diesem Gerät.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x.buf],{type:x.type||'image/jpeg'}));a.target='_blank';a.click()}catch(e){alert('Foto konnte nicht geöffnet werden.')}}
function delR(id,i){const m=S.m.find(x=>x.id==id),x=rd(m)[i];snap('Zählerstand gelöscht',x&&x.ph?[x.ph]:[]);m.r=rd(m).filter((_,j)=>j!=i);save();render()}
const inp=(l,k,o,key,type='text',num=0,extra='')=>`<label>${l}</label><input type="${type}" ${extra} value="${esc(o[key])}" onchange="upd('${k}','${o.id}','${key}',this.value,${num})">`;
function home(){
  if(!S.p.length)return`<div class="c">Willkommen! Lege zuerst unter <b>Profile</b> ein Strom- oder Gas-Profil an.</div>`;
  let tot=0;const wr=[];
  S.p.forEach(p=>{const c=calc(p),kk=kd(p),pw=peWarn(p);if(pw)wr.push(pw);if(kk&&!kk.missed&&kk.days<=60)wr.push(`${pic(p)} ${esc(p.n)}: Kündigung nur noch bis ${kk.ku.toLocaleDateString('de-DE')} möglich (in ${kk.days} Tagen)`);if(+p.bz>0&&c.cost>+p.bz)wr.push(`${pic(p)} ${esc(p.n)}: Prognose ${f(c.cost,0)} € liegt über dem Jahresbudget von ${f(p.bz,0)} €`);if(+p.vz>0&&p.t!='internet'&&c.kwh>+p.vz)wr.push(`${pic(p)} ${esc(p.n)}: Verbrauchsprognose ${f(c.kwh,0)} ${RU[p.t]} liegt über dem Ziel von ${f(p.vz,0)} ${RU[p.t]}`)});
  const rem=wr.map(x=>`<div class="c" style="border-color:var(--bad)">⚠️ ${x}</div>`).join('')+payRem()+S.m.map(m=>{const r=rd(m),l=r.at(-1),dd=l?Math.floor((new Date()-new Date(l.d))/864e5):999;return dd>30?`<div class="c" style="border-color:var(--st)">⏰ ${IC[m.t]} ${esc(m.n||m.nr||'Zähler')}: ${l?'letzter Stand vor '+dd+' Tagen':'noch kein Stand'} – bitte ablesen${qr(m)}</div>`:''}).join('')+((!S.lb||(new Date()-new Date(S.lb))/864e5>90)?'<div class="c" style="border-color:var(--st)">💾 Backup fällig – exportiere deine Daten im Tab Profile</div>':'');
  const h=S.p.map(p=>{const c=calc(p),pv=p.t=='pv';tot+=c.ab;
    return`<div class="c ${CL[p.t]}"><div class="mu">${pic(p)} ${TN[p.t]} · ${esc(p.n)} ${p.an?'· '+esc(p.an):''}${p.zl?' · 👤 '+esc(p.zl)+(p.z2?' / '+esc(p.z2):''):''}</div>
    <div class="big">${pv?f(-c.ab)+' € <span class="mu">Ertrag / Monat</span>':f(c.ab)+' € <span class="mu">/ Monat</span>'}</div>
    <div class="row"><span>${pv?'Jahresertrag':'Jahreskosten'}</span><b>${f(pv?-c.cost:c.cost)} €</b></div>
    <div class="row">${p.t=='internet'?`<span>Vertragsende</span><b>${p.ve?new Date(p.ve).toLocaleDateString('de-DE'):'–'}</b>`:`<span>${pv?'Einspeisung pro Jahr':'Jahresverbrauch'}</span><b>${f(c.kwh,p.t=='wasser'?1:0)} ${p.t=='wasser'?'m³':'kWh'}</b>`}</div>
    <div class="mu">${c.src}</div>${kh(p)}${p.pe_w?`<div class="mu">📈 ${peTxt(p)}</div>`:''}${zrow(p)}${bgBlock(p,c)}${abBlock(p,c)}${p.st?`<div class="mu">Abrechnung in ${Math.max(0,Math.ceil((new Date(p.st)-new Date())/864e5))} Tagen (${new Date(p.st).toLocaleDateString('de-DE')})</div>`:''}
    ${pv?'':`<button class="tg" onclick="pay('${p.id}')">✓ Zahlung buchen</button>`}<details class="wi"><summary class="mu">Was wäre wenn?</summary><label>Neuer Preis (${p.t=='wasser'?'€/m³':'ct/kWh'})</label><input id="wa${p.id}" inputmode="decimal" oninput="wi('${p.id}')"><label>Neue Grundgebühr (€/Monat)</label><input id="wg${p.id}" inputmode="decimal" oninput="wi('${p.id}')"><div id="wr${p.id}" class="big" style="font-size:1.1rem"></div></details></div>`}).join('');
  return rem+bkWarn()+hausWarn()+`<div class="c"><div class="mu">Gesamt monatlich (inkl. Fixkosten, abzgl. Einspeisung)</div><div class="big">${f(tot)} € <span class="mu">/ Monat</span></div>${+S.bg>0?pb('Monatsbudget',tot,+S.bg,'€'):''}</div>`+ytdCard()+h}
function pb(l,val,max,u){const q=val/max*100;return`<div class="row"><span>${l}</span><b class="${q>100?'up':''}">${f(val,0)} / ${f(max,0)} ${u}</b></div><div class="pbar"><div style="width:${Math.max(0,Math.min(100,q))}%;background:${q>100?'var(--bad)':q>85?'var(--st)':'var(--ok)'}"></div></div>`}
function bgBlock(p,c){let h='';if(+p.bz>0)h+=pb('Jahresbudget (Prognose)',c.cost,+p.bz,'€');if(+p.vz>0&&p.t!='internet'&&p.t!='pv')h+=pb('Verbrauchsziel (Prognose/Jahr)',c.kwh,+p.vz,RU[p.t]);return h}
function perOf(p){const t=new Date();t.setHours(0,0,0,0);let e;if(p.st){e=new Date(p.st+'T00:00:00');while(e<=t)e=add(e,12)}else e=new Date(t.getFullYear()+1,0,1);return{s:add(e,-12),e}}
function bal(p,c){const{s,e}=perOf(p),a=iso(s),b=iso(e),pays=S.h.filter(x=>x.t=='pay'&&x.pid==p.id&&x.d>=a&&x.d<b);if(!pays.length)return null;
 const paid=pays.reduce((q,x)=>q+x.v,0),ab=curAb(p)||c.ab,proj=paid+Math.max(0,12-pays.length)*ab;return{paid,n:pays.length,proj,b:c.cost-proj}}
function abBlock(p,c){let h='';if(c.diff!==null)h+=`<div class="row"><span>Aktueller Abschlag</span><b>${f(curAb(p))} €</b></div><div class="row"><span>Differenz zum Soll</span><b class="${c.diff>0?'up':'dn'}">${c.diff>0?'+':''}${f(c.diff)} €/Monat</b></div>`;
 const b=p.t=='internet'?null:bal(p,c);
 if(b)h+=`<div class="row"><span>Gezahlt im Zeitraum (${b.n}×)</span><b>${f(b.paid)} €</b></div><div class="row"><span>Prognose Abrechnung</span><b class="${b.b>0?'up':'dn'}">${b.b>0?'Nachzahlung':'Guthaben'} ca. ${f(Math.abs(b.b))} €</b></div><div class="mu">Gezahlt + restliche Abschläge bis Periodenende</div>`;
 else if(c.diff!==null)h+=`<div class="row"><span>Prognose Abrechnung</span><b class="${c.diff>0?'up':'dn'}">${c.diff>0?'Nachzahlung':'Guthaben'} ca. ${f(Math.abs(c.diff*12))} €</b></div>`;
 return h}
function pay(id){const p=S.p.find(x=>x.id==id),c=calc(p),d=p.t=='internet'?apAt(p,today()):(curAb(p)||c.ab),v=prompt('Gezahlter Betrag (€)',d.toFixed(2).replace('.',','));if(v===null)return;const n=parseFloat(String(v).replace(',','.'));if(isNaN(n))return alert('Ungültiger Betrag');S.h.push({id:uid(),t:'pay',pid:id,d:today(),v:n,n:''});save();render()}
function prof(){return S.p.map(p=>{if(p.t=='internet')return pi(p);if(p.t=='pv')return ppv(p);const ms=S.m.filter(m=>m.t==p.t);
  return`<div class="c ${CL[p.t]}"><details ${S.p.length<3?'open':''}><summary>${pic(p)} ${esc(p.n)||'Profil'}${sa(p)}</summary>
  ${inp('Profilname','p',p,'n')}${objsel('p',p)}${inp('Anbieter','p',p,'an')}
  ${inp(p.t=='wasser'?'Frischwasserpreis (€/m³, brutto)':'Arbeitspreis (ct/kWh, brutto)','p',p,'ap','text',1,'inputmode="decimal"')}
  ${p.t=='wasser'?inp('Abwasserpreis (€/m³)','p',p,'aw','text',1,'inputmode="decimal"')+inp('Niederschlagswasser (€/Jahr)','p',p,'nw','text',1,'inputmode="decimal"'):''}${inp('Grundgebühr (€/Monat, brutto)','p',p,'gp','text',1,'inputmode="decimal"')}
  ${inp('Bonus/Gutschrift (€/Jahr)','p',p,'bo','text',1,'inputmode="decimal"')}

 return rows.length?`<div class="c"><b>📊 Dieses Jahr vs. Vorjahr</b><div class="mu">Verbrauch seit 1.1. im Vergleich zum gleichen Zeitraum des Vorjahres</div>${rows.join('')}</div>`:''}
let LOCKED=false,LKF=0,LKT=0,HID=0;
function lkGet(){try{return JSON.parse(localStorage.getItem(LK)||'null')}catch(e){return null}}
function secUI(){const l=lkGet();return`<div class="c"><b>🔒 App-Sperre</b><div class="mu">${l?'PIN aktiv'+(l.bio?' · Face ID/Touch ID aktiv':''):'Nicht aktiv'}. Die Sperre verdeckt die App nach 30 Sekunden im Hintergrund. Die Daten selbst sind auf dem Gerät nicht verschlüsselt, verschlüsselt wird das Backup.</div><label>${l?'Neue PIN':'PIN (4–8 Ziffern)'}</label><input id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><label>PIN wiederholen</label><input id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button onclick="pinSave()">PIN speichern</button>${l?(l.bio?`<button class="tg" onclick="bioOff()">Face ID aus</button>`:`<button class="tg" onclick="bioOn()">Face ID aktivieren</button>`)+`<button class="x" onclick="pinOff()">Sperre entfernen</button>`:''}</div>`}
async function pinSave(){const a=$('pin1').value,b=$('pin2').value;if(!/^\d{4,8}$/.test(a))return alert('Bitte 4–8 Ziffern eingeben.');if(a!==b)return alert('Die PINs stimmen nicht überein.');
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),old=lkGet()||{};localStorage.setItem(LK,JSON.stringify({s:b64(salt),h:b64(await kdf(a,salt,100000)),bio:old.bio||''}));alert('PIN gespeichert.');render()}catch(e){alert('PIN konnte nicht gespeichert werden.')}}
function pinOff(){if(confirm('App-Sperre entfernen?')){localStorage.removeItem(LK);LOCKED=false;showLock();render()}}
function bioOff(){const l=lkGet();if(l){l.bio='';localStorage.setItem(LK,JSON.stringify(l));render()}}
async function bioOn(){if(!lkGet())return alert('Bitte zuerst eine PIN festlegen.');if(!window.PublicKeyCredential)return alert('Face ID wird auf diesem Gerät im Browser nicht unterstützt.');
 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Energix Calc'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'energix',displayName:'Energix'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});const l=lkGet();l.bio=b64(c.rawId);localStorage.setItem(LK,JSON.stringify(l));alert('Face ID / Touch ID aktiviert.');render()}catch(e){alert('Aktivierung nicht möglich. Die PIN funktioniert weiterhin.')}}
async function bioUnlock(){const l=lkGet();if(!l||!l.bio)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(l.bio)}],userVerification:'required',timeout:60000}});LOCKED=false;showLock()}catch(e){}}
async function unlock(){const l=lkGet();if(!l)return;if(Date.now()<LKT){$('lke').textContent='Bitte kurz warten…';return}const v=$('lkp').value;if(!v)return;
 try{if(b64(await kdf(v,unb64(l.s),100000))===l.h){LOCKED=false;LKF=0;showLock()}else{LKF++;$('lkp').value='';$('lke').textContent='Falsche PIN';if(LKF%5==0)LKT=Date.now()+30000}}catch(e){$('lke').textContent='Fehler beim Prüfen'}}
function showLock(){const l=lkGet(),e=$('lock');e.style.display=LOCKED?'flex':'none';if(LOCKED){$('lkb').style.display=l&&l.bio?'inline-block':'none';$('lkp').value='';$('lke').textContent='';if(l&&l.bio)setTimeout(bioUnlock,300)}}
function lkReset(){if(confirm('Alle Daten dieser App auf diesem Gerät löschen und die Sperre zurücksetzen?')){try{localStorage.clear();indexedDB.deleteDatabase('energix-docs')}catch(e){}location.reload()}}
document.addEventListener('visibilitychange',()=>{const on=!!lkGet();if(document.hidden){HID=Date.now();if(on)document.body.style.filter='blur(14px)'}else{document.body.style.filter='';if(on&&HID&&Date.now()-HID>30000){LOCKED=true;showLock()}}});
function render(){
  document.documentElement.style.fontSize=S.z+'%';
  if(S.th&&S.th!='auto')document.documentElement.setAttribute('data-th',S.th);else document.documentElement.removeAttribute('data-th');
  $('app').innerHTML=(NEWV?`<div class="c" style="border-color:var(--st)">🔄 Neue Version ${NEWV.v} (Build ${NEWV.b}) verfügbar<br><button onclick="hardReset()">Jetzt aktualisieren</button></div>`:'')+osel()+view(()=>({home,prof,meter,hist,chart,aus,set:setUI}[V]()))+`<datalist id="zl">${zn().map(n=>`<option value="${esc(n)}">`).join('')}</datalist><p class="mu" style="text-align:center">Energix Calc v${VER} · Build ${BUILD}</p>`;
  $('nav').innerHTML=[['home','🏠','Übersicht'],['prof','📝','Profile'],['meter','🔢','Zähler'],['hist','🕘','Historie'],['chart','📈','Verlauf'],['aus','👥','Auswertung'],['set','⚙️','Einstell.']].map(([k,i,l])=>`<a href="#" class="${V==k?'on':''}" onclick="go('${k}');return false">${i}<br>${l}</a>`).join('')}
// Icon + Manifest zur Laufzeit erzeugen (Einzeldatei-PWA)
(function(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  x.fillStyle='#0f172a';x.fillRect(0,0,512,512);x.fillStyle='#f59e0b';x.beginPath();x.moveTo(300,60);x.lineTo(150,290);x.lineTo(250,290);x.lineTo(210,452);x.lineTo(370,210);x.lineTo(270,210);x.closePath();x.fill();
  const u=c.toDataURL('image/png');let l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
  const man={name:'Energix Calc',short_name:'Energix',display:'standalone',background_color:'#0f172a',theme_color:'#0f172a',start_url:location.href.split('#')[0],icons:[{src:u,sizes:'512x512',type:'image/png',purpose:'any'}],shortcuts:[['meter','Zähler ablesen'],['hist','Historie'],['aus','Auswertung']].map(x=>({name:x[1],url:location.href.split('#')[0]+'#'+x[0]}))};
  l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));document.head.appendChild(l)})();
if(window.addEventListener)window.addEventListener('hashchange',()=>{const t=TABS[location.hash.slice(1).toLowerCase()];if(t){V=t;render()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
LOCKED=!!lkGet();showLock();
render();
remote().then(x=>{if(x.b>BUILD){NEWV=x;render()}}).catch(()=>{});
</script></body></html>
