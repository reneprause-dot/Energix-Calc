<html lang="de"><head><meta charset="utf-8">

<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--st:#f59e0b;--ga:#38bdf8;--ok:#4ade80;--bad:#f87171;--bd:#334155;--wa:#2dd4bf;--in:#a78bfa}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1}}
*{box-sizing:border-box}html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(4.5rem + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem}
h1{margin:0;font-size:1.4rem}h1 span{color:var(--st)}
main{max-width:42rem;margin:0 auto;padding:0 1rem}
.c{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem;margin:0 0 .9rem}
.c.s{border-left:.3rem solid var(--st)}.c.w{border-left:.3rem solid var(--wa)}.c.i{border-left:.3rem solid var(--in)}.c.p{border-left:.3rem solid #facc15}.c.i .wi,.c.p .wi{display:none}button.p{background:#facc15}.pbar{height:.45rem;border-radius:.3rem;background:var(--bd);overflow:hidden;margin:.1rem 0 .4rem}.pbar div{height:100%}button.i{background:var(--in)}.c.g{border-left:.3rem solid var(--ga)}
.big{font-size:2rem;font-weight:700}.mu{color:var(--mu);font-size:.85rem}
.row{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0}
label{display:block;margin:.6rem 0 .15rem;font-size:.85rem;color:var(--mu)}
input,select{width:100%;padding:.6rem;font-size:1rem;border-radius:.6rem;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{padding:.6rem 1rem;font-size:1rem;border:0;border-radius:.6rem;background:var(--st);color:#000;font-weight:600;margin:.4rem .3rem 0 0}
button.w{background:var(--wa)}button.tg{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.g{background:var(--ga)}button.x{background:transparent;color:var(--bad);border:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:.8rem .2rem;color:var(--mu);font-size:.72rem}
nav a.on{color:var(--st);font-weight:700}
.up{color:var(--bad)}.dn{color:var(--ok)}
.sc{overflow-x:auto}@media print{nav,header,button{display:none}}
details summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><h1>Energix <span>Calc</span></h1><div><button class="x" onclick="zoom(-10)">A−</button><button class="x" onclick="zoom(10)">A+</button><button class="x" onclick="checkUpd()" title="Aktualisieren">⟳</button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="lock" style="display:none;position:fixed;inset:0;z-index:99;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;padding:2rem;text-align:center"><h1 style="font-size:2rem">⚡ Energix <span>Calc</span></h1><p class="mu">App gesperrt</p><input id="lkp" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off" style="max-width:14rem;text-align:center;font-size:1.4rem" onkeydown="if(event.key=='Enter')unlock()"><div id="lke" class="up" style="min-height:1.4rem"></div><div><button onclick="unlock()">Entsperren</button><button id="lkb" class="tg" onclick="bioUnlock()" style="display:none">Face ID</button></div><button class="x" onclick="lkReset()" style="margin-top:2rem">PIN vergessen? App zurücksetzen</button></div>
<script>
const VER='2.1.0',BUILD=14,GM='gemini-2.5-flash',IC={strom:'⚡',gas:'🔥',wasser:'💧',internet:'🌐',pv:'☀️'},TN={strom:'Strom',gas:'Gas',wasser:'Wasser',internet:'Fixkosten',pv:'Einspeisung'},CL={strom:'s',gas:'g',wasser:'w',internet:'i',pv:'p'},RU={strom:'kWh',gas:'m³',wasser:'m³',pv:'kWh'},K='energix.v1',$=id=>document.getElementById(id);
let S={p:[],m:[],h:[],dc:[],z:100},V='home',CM=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
function norm(){if(!Array.isArray(S.o)||!S.o.length)S.o=[{id:'o1',n:'Eigenheim'}];if(!S.ao||(S.ao!='all'&&!S.o.find(o=>o.id==S.ao)))S.ao=S.o[0].id;S.p.forEach(x=>{if(!x.o)x.o=S.o[0].id});S.m.forEach(x=>{if(!x.o)x.o=S.o[0].id})}
const curO=()=>S.ao=='all'?S.o[0].id:S.ao,inO=x=>S.ao=='all'||x.o==S.ao;
function view(fn){const P=S.p,M=S.m,H=S.h;S.p=P.filter(inO);S.m=M.filter(inO);S.h=H.filter(h=>S.p.some(p=>p.id==h.pid));try{return fn()}finally{S.p=P;S.m=M;S.h=H}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Speichern nicht möglich')}};
try{S.gk=localStorage.getItem('energix.gk')||S.gk||''}catch(e){}
norm();
const uid=()=>Math.random().toString(36).slice(2,9);
const f=(n,d=2)=>(+n||0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const isoU=ms=>new Date(ms).toISOString().slice(0,10),today=()=>iso(new Date());
function zoom(d){S.z=Math.min(160,Math.max(70,S.z+d));save();document.documentElement.style.fontSize=S.z+'%'}
function go(v){V=v;render();scrollTo(0,0)}
function curAb(p){const a=S.h.filter(x=>x.t=='ab'&&x.pid==p.id).sort((x,y)=>x.d.localeCompare(y.d)).at(-1);return a?a.v:+p.cur||0}
function rd(m){return [...m.r].sort((a,b)=>a.d.localeCompare(b.d))}
function fac(m){if(m.t!='gas')return 1;const p=S.p.find(p=>p.mid==m.id);return +(p&&p.bw)||10}
function calc(p){if(p.t=='internet'){const g=apAt(p,today()),cost=g*12/(+p.iv||1)-(+p.bo||0);return{kwh:0,src:'',cost,ab:cost/12,diff:null}}

  const m=S.m.find(m=>m.id==p.mid);let kwh=+p.est||0,src='manuell geschätzt';
  if(m){const r=rd(m);if(r.length>1){const days=(new Date(r.at(-1).d)-new Date(r[0].d))/864e5;
    if(days>=30){kwh=(r.at(-1).v-r[0].v)*fac(m)/days*365;src='hochgerechnet aus Zählerständen'}}}
  if(p.t=='pv'){const A=apAt(p,today()),cost=-(kwh*A/100)+(+p.gp||0)*12-(+p.bo||0);return{kwh,src,cost,ab:cost/12,diff:null}}
  const W=p.t=='wasser',A=apAt(p,today()),cost=((W?kwh*(A+(+p.aw||0))+(+p.nw||0):kwh*A/100)+p.gp*12-(+p.bo||0))*(1+(+p.pf||0)/100);
  return{kwh,src,cost,ab:cost/12,diff:curAb(p)?cost/12-curAb(p):null}}
function periods(m){const r=rd(m),o=[];for(let i=1;i<r.length;i++){const d=(new Date(r[i].d)-new Date(r[i-1].d))/864e5;
  if(d>0){const k=(r[i].v-r[i-1].v)*fac(m);o.push({d:r[i].d,s:r[i-1].d,k,pd:k/d})}}return o}
const D={strom:['Strom',35,12,3000],gas:['Gas',10,10,15000],wasser:['Wasser',2.2,5,120],internet:['Fixkosten',0,0,0],pv:['Einspeisung',8,0,3000]};function addP(t){const d=D[t];S.p.push({id:uid(),o:curO(),t,n:d[0],an:'',ap:d[1],gp:d[2],bo:0,bw:10,aw:t=='wasser'?2.5:0,nw:0,est:d[3],cur:0,pf:0,mid:'',ve:'',kf:1,iv:1,za:'',zd:'',ri:0,rl:3,ic:t=='internet'?'💶':''});save();render()}
function addM(t){S.m.push({id:uid(),o:curO(),t,n:'',nr:'',r:[]});save();render()}
function upd(k,id,key,val,num){const o=S[k].find(x=>x.id==id);o[key]=num?parseFloat(String(val).replace(',','.'))||0:val;if(k=='p'&&key=='cur'&&o.cur>0)S.h.push({id:uid(),t:'ab',pid:id,d:today(),v:o.cur,n:'Profil geändert'});save();if(k=='p'&&['vb','ml','vl','kf','ve'].includes(key)){const e=$('kd'+id);if(e)e.innerHTML=kdTxt(o)}if(key=='mid'||key=='t'||key=='o'||k=='o')render()}
function del(k,id){if(confirm('Wirklich löschen?')){if(k=='p'){S.dc.filter(d=>d.pid==id).forEach(d=>dbx('readwrite',st=>st.delete(d.id)));S.dc=S.dc.filter(d=>d.pid!=id)}S[k]=S[k].filter(x=>x.id!=id);save();render()}}
function addR(id){const m=S.m.find(x=>x.id==id),d=$('d'+id).value,v=parseFloat($('v'+id).value.replace(',','.'));
  if(!d||isNaN(v))return alert('Datum und Stand eingeben');if(!chk(m,d,v))return;m.r.push({d,v});save();render()}
function delR(id,i){const m=S.m.find(x=>x.id==id);m.r=rd(m).filter((_,j)=>j!=i);save();render()}
const inp=(l,k,o,key,type='text',num=0,extra='')=>`<label>${l}</label><input type="${type}" ${extra} value="${esc(o[key])}" onchange="upd('${k}','${o.id}','${key}',this.value,${num})">`;
function home(){
  if(!S.p.length)return`<div class="c">Willkommen! Lege zuerst unter <b>Profile</b> ein Strom- oder Gas-Profil an.</div>`;
  let tot=0;const wr=[];
  S.p.forEach(p=>{const c=calc(p),kk=kd(p);if(kk&&!kk.missed&&kk.days<=60)wr.push(`${pic(p)} ${esc(p.n)}: Kündigung nur noch bis ${kk.ku.toLocaleDateString('de-DE')} möglich (in ${kk.days} Tagen)`);if(+p.bz>0&&c.cost>+p.bz)wr.push(`${pic(p)} ${esc(p.n)}: Prognose ${f(c.cost,0)} € liegt über dem Jahresbudget von ${f(p.bz,0)} €`);if(+p.vz>0&&p.t!='internet'&&c.kwh>+p.vz)wr.push(`${pic(p)} ${esc(p.n)}: Verbrauchsprognose ${f(c.kwh,0)} ${RU[p.t]} liegt über dem Ziel von ${f(p.vz,0)} ${RU[p.t]}`)});
  const rem=wr.map(x=>`<div class="c" style="border-color:var(--bad)">⚠️ ${x}</div>`).join('')+payRem()+S.m.map(m=>{const r=rd(m),l=r.at(-1),dd=l?Math.floor((new Date()-new Date(l.d))/864e5):999;return dd>30?`<div class="c" style="border-color:var(--st)">⏰ ${IC[m.t]} ${esc(m.n||m.nr||'Zähler')}: ${l?'letzter Stand vor '+dd+' Tagen':'noch kein Stand'} – bitte ablesen</div>`:''}).join('')+((!S.lb||(new Date()-new Date(S.lb))/864e5>90)?'<div class="c" style="border-color:var(--st)">💾 Backup fällig – exportiere deine Daten im Tab Profile</div>':'');
  const h=S.p.map(p=>{const c=calc(p),pv=p.t=='pv';tot+=c.ab;
    return`<div class="c ${CL[p.t]}"><div class="mu">${pic(p)} ${TN[p.t]} · ${esc(p.n)} ${p.an?'· '+esc(p.an):''}${p.zl?' · 👤 '+esc(p.zl)+(p.z2?' / '+esc(p.z2):''):''}</div>
    <div class="big">${pv?f(-c.ab)+' € <span class="mu">Ertrag / Monat</span>':f(c.ab)+' € <span class="mu">/ Monat</span>'}</div>
    <div class="row"><span>${pv?'Jahresertrag':'Jahreskosten'}</span><b>${f(pv?-c.cost:c.cost)} €</b></div>
    <div class="row">${p.t=='internet'?`<span>Vertragsende</span><b>${p.ve?new Date(p.ve).toLocaleDateString('de-DE'):'–'}</b>`:`<span>${pv?'Einspeisung pro Jahr':'Jahresverbrauch'}</span><b>${f(c.kwh,p.t=='wasser'?1:0)} ${p.t=='wasser'?'m³':'kWh'}</b>`}</div>
    <div class="mu">${c.src}</div>${kh(p)}${zrow(p)}${bgBlock(p,c)}${abBlock(p,c)}${p.st?`<div class="mu">Abrechnung in ${Math.max(0,Math.ceil((new Date(p.st)-new Date())/864e5))} Tagen (${new Date(p.st).toLocaleDateString('de-DE')})</div>`:''}
    ${pv?'':`<button class="tg" onclick="pay('${p.id}')">✓ Zahlung buchen</button>`}<details class="wi"><summary class="mu">Was wäre wenn?</summary><label>Neuer Preis (${p.t=='wasser'?'€/m³':'ct/kWh'})</label><input id="wa${p.id}" inputmode="decimal" oninput="wi('${p.id}')"><label>Neue Grundgebühr (€/Monat)</label><input id="wg${p.id}" inputmode="decimal" oninput="wi('${p.id}')"><div id="wr${p.id}" class="big" style="font-size:1.1rem"></div></details></div>`}).join('');
  return rem+`<div class="c"><div class="mu">Gesamt monatlich (inkl. Fixkosten, abzgl. Einspeisung)</div><div class="big">${f(tot)} € <span class="mu">/ Monat</span></div>${+S.bg>0?pb('Monatsbudget',tot,+S.bg,'€'):''}</div>`+h}
function pb(l,val,max,u){const q=val/max*100;return`<div class="row"><span>${l}</span><b class="${q>100?'up':''}">${f(val,0)} / ${f(max,0)} ${u}</b></div><div class="pbar"><div style="width:${Math.max(0,Math.min(100,q))}%;background:${q>100?'var(--bad)':q>85?'var(--st)':'var(--ok)'}"></div></div>`}
function bgBlock(p,c){let h='';if(+p.bz>0)h+=pb('Jahresbudget (Prognose)',c.cost,+p.bz,'€');if(+p.vz>0&&p.t!='internet'&&p.t!='pv')h+=pb('Verbrauchsziel (Prognose/Jahr)',c.kwh,+p.vz,RU[p.t]);return h}
function perOf(p){const t=new Date();t.setHours(0,0,0,0);let e;if(p.st){e=new Date(p.st+'T00:00:00');while(e<=t)e=add(e,12)}else e=new Date(t.getFullYear()+1,0,1);return{s:add(e,-12),e}}
function bal(p,c){const{s,e}=perOf(p),a=iso(s),b=iso(e),pays=S.h.filter(x=>x.t=='pay'&&x.pid==p.id&&x.d>=a&&x.d<b);if(!pays.length)return null;
 const paid=pays.reduce((q,x)=>q+x.v,0),ab=curAb(p)||c.ab,proj=paid+Math.max(0,12-pays.length)*ab;return{paid,n:pays.length,proj,b:c.cost-proj}}
function abBlock(p,c){let h='';if(c.diff!==null)h+=`<div class="row"><span>Aktueller Abschlag</span><b>${f(curAb(p))} €</b></div><div class="row"><span>Differenz zum Soll</span><b class="${c.diff>0?'up':'dn'}">${c.diff>0?'+':''}${f(c.diff)} €/Monat</b></div>`;
 const b=p.t=='internet'?null:bal(p,c);
 if(b)h+=`<div class="row"><span>Gezahlt im Zeitraum (${b.n}×)</span><b>${f(b.paid)} €</b></div><div class="row"><span>Prognose Abrechnung</span><b class="${b.b>0?'up':'dn'}">${b.b>0?'Nachzahlung':'Guthaben'} ca. ${f(Math.abs(b.b))} €</b></div><div class="mu">Gezahlt + restliche Abschläge bis Periodenende</div>`;
 else if(c.diff!==null)h+=`<div class="row"><span>Prognose Abrechnung</span><b class="${c.diff>0?'up':'dn'}">${c.diff>0?'Nachzahlung':'Guthaben'} ca. ${f(Math.abs(c.diff*12))} €</b></div>`;
 return h}
function pay(id){const p=S.p.find(x=>x.id==id),c=calc(p),d=p.t=='internet'?apAt(p,today()):(curAb(p)||c.ab),v=prompt('Gezahlter Betrag (€)',d.toFixed(2).replace('.',','));if(v===null)return;const n=parseFloat(String(v).replace(',','.'));if(isNaN(n))return alert('Ungültiger Betrag');S.h.push({id:uid(),t:'pay',pid:id,d:today(),v:n,n:''});save();render()}
function prof(){return S.p.map(p=>{if(p.t=='internet')return pi(p);if(p.t=='pv')return ppv(p);const ms=S.m.filter(m=>m.t==p.t);
  return`<div class="c ${CL[p.t]}"><details ${S.p.length<3?'open':''}><summary>${pic(p)} ${esc(p.n)||'Profil'}</summary>
  ${inp('Profilname','p',p,'n')}${objsel('p',p)}${inp('Anbieter','p',p,'an')}
  ${inp(p.t=='wasser'?'Frischwasserpreis (€/m³, brutto)':'Arbeitspreis (ct/kWh, brutto)','p',p,'ap','text',1,'inputmode="decimal"')}
  ${p.t=='wasser'?inp('Abwasserpreis (€/m³)','p',p,'aw','text',1,'inputmode="decimal"')+inp('Niederschlagswasser (€/Jahr)','p',p,'nw','text',1,'inputmode="decimal"'):''}${inp('Grundgebühr (€/Monat, brutto)','p',p,'gp','text',1,'inputmode="decimal"')}
  ${inp('Bonus/Gutschrift (€/Jahr)','p',p,'bo','text',1,'inputmode="decimal"')}
  ${p.t=='gas'?inp('Umrechnung m³ → kWh (Brennwert × Zustandszahl)','p',p,'bw','text',1,'inputmode="decimal"'):''}
  ${inp('Geschätzter Jahresverbrauch ('+(p.t=='wasser'?'m³':'kWh')+') – falls keine Zählerstände','p',p,'est','text',1,'inputmode="decimal"')}
  ${inp('Aktueller Abschlag (€/Monat)','p',p,'cur','text',1,'inputmode="decimal"')}${inp('Jahresbudget Kosten (€, optional)','p',p,'bz','text',1,'inputmode="decimal"')}${inp('Verbrauchsziel pro Jahr ('+(p.t=='wasser'?'m³':'kWh')+', optional)','p',p,'vz','text',1,'inputmode="decimal"')}
  ${zf(p)}${zfld(p)}${inp('Nächster Abrechnungsstichtag','p',p,'st','date')}${inp('Sicherheitspuffer (%)','p',p,'pf','text',1,'inputmode="decimal"')}${vtr(p)}
  <label>Zähler</label><select onchange="upd('p','${p.id}','mid',this.value)"><option value="">– keiner –</option>${ms.map(m=>`<option value="${m.id}" ${m.id==p.mid?'selected':''}>${esc(m.n||m.nr||'Zähler')}</option>`).join('')}</select>
  <button class="x" onclick="del('p','${p.id}')">Profil löschen</button></details></div>`}).join('')
  +`<button onclick="addP('strom')">+ Strom-Profil</button><button class="g" onclick="addP('gas')">+ Gas-Profil</button><button class="w" onclick="addP('wasser')">+ Wasser-Profil</button><button class="i" onclick="addP('internet')">+ Fixkosten</button><button class="p" onclick="addP('pv')">+ Einspeisung (PV)</button>
  ${objUI()}${secUI()}<div class="c" style="margin-top:1rem"><b>Backup</b><label>Backup-Passwort (für verschlüsselten Export/Import)</label><input id="bkpw" type="password" autocomplete="off"><button class="x" onclick="exp()">Backup (JSON)</button><button class="x" onclick="expEnc()">🔒 Verschlüsselt</button><button class="x" onclick="csv()">CSV</button><button class="x" onclick="print()">Drucken / PDF</button><button class="x" onclick="$('imp').click()">Importieren</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div><div class="c"><b>App</b><div class="mu">Version ${VER} · Build ${BUILD}</div><button onclick="checkUpd()">Auf Updates prüfen</button><button class="x" onclick="hardReset(true)">Hard Reset</button><div class="mu" style="margin-top:.5rem">Löscht nur den App-Cache und lädt neu – deine Daten bleiben erhalten.</div>${kui()}</div>`}
function meter(){return S.m.map(m=>{const r=rd(m);
  return`<div class="c ${CL[m.t]}"><details open><summary>${IC[m.t]} ${esc(m.n||m.nr||'Zähler')}</summary>
  ${inp('Bezeichnung','m',m,'n')}${inp('Zählernummer','m',m,'nr')}${objsel('m',m)}
  <label>Zählerstände (${RU[m.t]})</label>
  ${r.map((x,i)=>`<div class="row"><span>${new Date(x.d).toLocaleDateString('de-DE')}</span><b>${f(x.v,1)}</b><button class="x" style="margin:0" onclick="edit('s','${m.id}',${i})">✎</button><button class="x" style="margin:0" onclick="delR('${m.id}',${i})">✕</button></div>`).join('')||'<div class="mu">Noch keine Stände</div>'}
  <label>Neuer Stand</label><input type="date" id="d${m.id}" value="${today()}"><input id="v${m.id}" inputmode="decimal" placeholder="Zählerstand" style="margin-top:.4rem">
  <button onclick="addR('${m.id}')">Stand speichern</button><button class="g" onclick="$('ph${m.id}').click()">📷 Foto</button><input type="file" id="ph${m.id}" accept="image/*" capture="environment" hidden onchange="ocr(this.files[0],'${m.id}')"><button class="x" onclick="del('m','${m.id}')">Zähler löschen</button></details></div>`}).join('')
  +`<button onclick="addM('strom')">+ Stromzähler</button><button class="g" onclick="addM('gas')">+ Gaszähler</button><button class="w" onclick="addM('wasser')">+ Wasserzähler</button><button class="p" onclick="addM('pv')">+ Einspeisezähler</button>`}
const COL={strom:['#f59e0b','#fcd34d','#b45309'],gas:['#38bdf8','#7dd3fc','#0369a1'],wasser:['#2dd4bf','#99f6e4','#0f766e'],pv:['#facc15','#fde68a','#a16207']};
let CF={mode:'v'};
const ZA=['Lastschrift','Dauerauftrag','Überweisung','PayPal','Kreditkarte','Bar','Sonstiges'];

function nice(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),n=v/e;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}

function trendOf(P){if(P.length<2)return null;const a=P.at(-2).pd,b=P.at(-1).pd,last=a?(b-a)/a*100:0;let tot=null;
 if(P.length>=3){const p=P.map(q=>({x:+new Date(q.d),y:q.pd})),x0=p[0].x,ft=lin(p,x0),mean=p.reduce((s,q)=>s+q.y,0)/p.length,span=(p.at(-1).x-x0)/864e5;if(ft&&mean)tot=ft.m*span/mean*100}

function axChart(L,yt){const pts=L.flatMap(q=>q.p);if(!pts.length)return'';
 let x0=Math.min(...pts.map(p=>p.s??p.x)),x1=Math.max(...pts.map(p=>p.x));if(x0==x1){x0-=864e5;x1+=864e5}
 let y0=0,y1=Math.max(...pts.map(p=>p.y));if(y1<=y0)y1=y0+1;
 const st=nice((y1-y0)/4),dec=st>=1?0:st>=.1?1:2;y0=Math.floor(y0/st+1e-9)*st;y1=Math.ceil(y1/st-1e-9)*st;if(y1<=y0)y1=y0+st;
 const W=360,H=260,ML=54,MR=14,MT=14,MB=46,X=x=>ML+(x-x0)/(x1-x0)*(W-ML-MR),Y=y=>MT+(1-(y-y0)/(y1-y0))*(H-MT-MB),tx='fill="currentColor"';
 let g='';const n=Math.round((y1-y0)/st);
 for(let i=0;i<=n;i++){const v=y0+i*st,yy=Y(v);g+=`<line x1="${ML}" x2="${W-MR}" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".15"/><text x="${ML-6}" y="${yy+3}" font-size="10" text-anchor="end" ${tx} opacity=".75">${f(v,dec)}</text>`}
 const span=(x1-x0)/864e5;
 for(let i=0;i<=4;i++){const xv=x0+(x1-x0)*i/4,d=new Date(xv),lb=span<=200?d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):d.toLocaleDateString('de-DE',{month:'2-digit',year:'2-digit'}),xx=X(xv);
  g+=`<line x1="${xx}" x2="${xx}" y1="${H-MB}" y2="${H-MB+4}" stroke="currentColor" opacity=".5"/><text x="${xx}" y="${H-MB+16}" font-size="10" text-anchor="${i==0?'start':i==4?'end':'middle'}" ${tx} opacity=".75">${lb}</text>`}
 g+=`<line x1="${ML}" x2="${ML}" y1="${MT}" y2="${H-MB}" stroke="currentColor" opacity=".5"/><line x1="${ML}" x2="${W-MR}" y1="${H-MB}" y2="${H-MB}" stroke="currentColor" opacity=".5"/>`;
 const cy=(MT+H-MB)/2;

 L.forEach(q=>{const P=q.p;if(CF.mode=='v'){P.forEach(p=>{const a=X(p.s)+1,b=X(p.x)-1,yy=Y(p.y);g+=`<rect x="${a.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(2,b-a).toFixed(1)}" height="${(Y(y0)-yy).toFixed(1)}" rx="3" fill="${q.c}" opacity=".6"/>`;if(L.length==1&&P.length<=8)g+=`<text x="${((a+b)/2).toFixed(1)}" y="${(yy-4).toFixed(1)}" font-size="9" text-anchor="middle" ${tx}>${f(p.y,dec)}</text>`});return}g+=`<polyline fill="none" stroke="${q.c}" stroke-width="2.2" stroke-linejoin="round" points="${P.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')}"/>`;
  if(P.length>=3){const ft=lin(P,P[0].x);if(ft){const a=P[0].x,b=P.at(-1).x,ya=Math.min(y1,Math.max(y0,ft.b)),yb=Math.min(y1,Math.max(y0,ft.b+ft.m*(b-a)/864e5));g+=`<line x1="${X(a)}" y1="${Y(ya)}" x2="${X(b)}" y2="${Y(yb)}" stroke="${q.c}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".8"/>`}}
  P.forEach(p=>{g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${q.c}"/>`;if(L.length==1&&P.length<=8)g+=`<text x="${X(p.x).toFixed(1)}" y="${(Y(p.y)-8).toFixed(1)}" font-size="9" text-anchor="middle" ${tx}>${f(p.y,dec)}</text>`})});
